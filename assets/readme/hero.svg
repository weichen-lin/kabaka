<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Kabaka — a Go message queue you can watch</title>
  <desc id="d">Kabaka is a Go message queue with retries, JSON Schema validation and a real-time dashboard embedded in the binary. A code card shows creating a Kabaka instance with 20 workers, a topic and a publish call.</desc>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <rect width="1200" height="440" rx="28" fill="#F7F3EC"/>

  <!-- title block -->
  <g class="sans" transform="translate(64 0)">
    <text x="0" y="84" font-size="20" font-weight="700" letter-spacing="3" fill="#C96442">GO · MESSAGE QUEUE · BUILT-IN DASHBOARD</text>
    <rect x="0" y="100" width="56" height="7" rx="3.5" fill="#C96442"/>

    <text x="-4" y="204" font-size="104" font-weight="800" fill="#15284E">Kabaka</text>

    <text x="0" y="256" font-size="27" font-weight="700" fill="#15284E">A Go message queue you can actually watch.</text>
    <text x="0" y="296" font-size="25" fill="#6E7A92">Publish, retry, audit — and read every number live</text>
    <text x="0" y="330" font-size="25" fill="#6E7A92">from a dashboard embedded in your binary.</text>

    <!-- fact pills -->
    <g transform="translate(0 362)">
      <rect x="0" y="0" width="196" height="46" rx="23" fill="#FFFFFF" stroke="#E3DACE" stroke-width="2"/>
      <text x="22" y="30" font-size="19" font-weight="600" fill="#15284E">10 workers default</text>

      <rect x="210" y="0" width="188" height="46" rx="23" fill="#FFFFFF" stroke="#E3DACE" stroke-width="2"/>
      <circle cx="236" cy="23" r="6" fill="#00B5CE"/>
      <text x="252" y="30" font-size="19" font-weight="600" fill="#15284E">memory + redis</text>

      <rect x="412" y="0" width="176" height="46" rx="23" fill="#FFFFFF" stroke="#E3DACE" stroke-width="2"/>
      <text x="434" y="30" font-size="19" font-weight="600" fill="#15284E">MIT licensed</text>
    </g>
  </g>

  <!-- code proof card -->
  <g transform="translate(694 66) rotate(-1.4 226 140)">
    <rect x="10" y="14" width="452" height="284" rx="22" fill="#E6DED3"/>
    <rect x="0" y="0" width="452" height="284" rx="22" fill="#15284E"/>
    <circle cx="30" cy="32" r="6" fill="#F58A6B"/>
    <circle cx="50" cy="32" r="6" fill="#FBD08A"/>
    <circle cx="70" cy="32" r="6" fill="#00B5CE"/>
    <text x="94" y="38" class="mono" font-size="17" fill="#8FA0BE">main.go</text>

    <g class="mono" font-size="20">
      <text x="28" y="88" fill="#FFFFFF">k := kabaka.NewKabaka(</text>
      <text x="52" y="120" fill="#FFFFFF">kabaka.WithMaxWorkers(<tspan fill="#FBD08A">20</tspan>),</text>
      <text x="28" y="152" fill="#FFFFFF">)</text>
      <text x="28" y="192" fill="#FFFFFF">k.CreateTopic(<tspan fill="#7FE3C0">"signup"</tspan>, run)</text>
      <text x="28" y="224" fill="#FFFFFF">k.Start()</text>
      <text x="28" y="256" fill="#FFFFFF">k.Publish(<tspan fill="#7FE3C0">"signup"</tspan>, payload)</text>
    </g>
  </g>

  <!-- dashboard pill card -->
  <g class="sans" transform="translate(706 364) rotate(1.6 214 30)">
    <rect x="8" y="10" width="428" height="60" rx="18" fill="#E6DED3"/>
    <rect x="0" y="0" width="428" height="60" rx="18" fill="#FFFFFF" stroke="#E3DACE" stroke-width="2"/>
    <circle cx="34" cy="30" r="8" fill="#00B5CE"/>
    <text x="56" y="37" font-size="20" font-weight="700" fill="#15284E">dashboard live on</text>
    <text x="238" y="37" class="mono" font-size="20" fill="#C96442">localhost:8787</text>
  </g>
</svg>
