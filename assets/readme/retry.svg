<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Retry backoff timeline</title>
  <desc id="d">With WithMaxRetries(3) and WithRetryDelay(1s), a failing job runs four times: after the first failure it waits 2 seconds, after the second 4 seconds, after the third 8 seconds, and the fourth failure marks the job dead. The wait is retryDelay multiplied by two to the power of the attempt number.</desc>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <rect width="1200" height="380" rx="28" fill="#F7F3EC"/>

  <g class="sans">
    <text x="64" y="78" font-size="20" font-weight="700" letter-spacing="3" fill="#C96442">RETRY MATH</text>
    <rect x="64" y="94" width="56" height="7" rx="3.5" fill="#C96442"/>
    <text x="62" y="152" font-size="42" font-weight="800" fill="#15284E">Every retry waits twice as long</text>
  </g>

  <!-- timeline -->
  <g class="sans">
    <text class="mono" x="64" y="196" font-size="19" fill="#6E7A92">WithMaxRetries(3) · WithRetryDelay(1s)</text>

    <path d="M96 262 H676" stroke="#DCD2C4" stroke-width="4" stroke-linecap="round"/>

    <path d="M116 262 H184" stroke="#FBD08A" stroke-width="10" stroke-linecap="round"/>
    <path d="M216 262 H364" stroke="#FBD08A" stroke-width="10" stroke-linecap="round"/>
    <path d="M396 262 H636" stroke="#FBD08A" stroke-width="10" stroke-linecap="round"/>

    <text x="132" y="240" font-size="20" font-weight="700" fill="#8A5312">2s</text>
    <text x="272" y="240" font-size="20" font-weight="700" fill="#8A5312">4s</text>
    <text x="500" y="240" font-size="20" font-weight="700" fill="#8A5312">8s</text>

    <g fill="#FFFFFF" stroke="#C96442" stroke-width="4">
      <circle cx="100" cy="262" r="17"/>
      <circle cx="200" cy="262" r="17"/>
      <circle cx="380" cy="262" r="17"/>
    </g>
    <g stroke="#C96442" stroke-width="4" stroke-linecap="round">
      <path d="M93 255 l14 14 M107 255 l-14 14"/>
      <path d="M193 255 l14 14 M207 255 l-14 14"/>
      <path d="M373 255 l14 14 M387 255 l-14 14"/>
    </g>

    <circle cx="660" cy="262" r="21" fill="#C96442"/>
    <path d="M651 253 l18 18 M669 253 l-18 18" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>

    <g font-size="19" fill="#6E7A92">
      <text x="76" y="312">run 1</text>
      <text x="176" y="312">run 2</text>
      <text x="356" y="312">run 3</text>
    </g>
    <text x="596" y="312" font-size="19" font-weight="700" fill="#C96442">run 4 → dead</text>
  </g>

  <!-- formula card -->
  <g class="sans" transform="translate(828 176) rotate(1.4 154 82)">
    <rect x="8" y="10" width="308" height="164" rx="20" fill="#E6DED3"/>
    <rect x="0" y="0" width="308" height="164" rx="20" fill="#15284E"/>
    <text x="24" y="46" font-size="19" font-weight="700" letter-spacing="1.8" fill="#00B5CE">THE RULE</text>
    <text class="mono" x="24" y="88" font-size="21" fill="#FFFFFF">wait = retryDelay</text>
    <text class="mono" x="24" y="116" font-size="21" fill="#FFFFFF">       × 2^attempt</text>
    <text x="24" y="146" font-size="18" fill="#8FA0BE">3 retries → 4 runs total</text>
  </g>
</svg>
